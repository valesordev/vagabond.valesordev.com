server {
  listen 80;
  server_name vagabond.local _;
  resolver 127.0.0.11 ipv6=off valid=10s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # Next.js frontend
  location / {
    set $web_upstream vagabond-pi-web:3000;
    proxy_pass http://$web_upstream;
  }

  # NextAuth — stays on the web container
  location /api/auth/ {
    set $web_auth_upstream vagabond-pi-web:3000;
    proxy_pass http://$web_auth_upstream;
  }

  # Rust API — inject dev user ID so VAGABOND_DEV_AUTH=true works without a token
  location /api/ {
    set $api_upstream vagabond-pi-server:3001;
    proxy_set_header X-Vagabond-User-Id $http_x_vagabond_user_id;
    proxy_pass http://$api_upstream;
  }

  # Martin vector tile server
  location /tiles/ {
    set $tiles_upstream vagabond-pi-martin:3000;
    proxy_pass http://$tiles_upstream/;
  }
}
