server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=10s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # Next.js frontend
  location / {
    set $web_upstream vagabond-web:3000;
    proxy_pass http://$web_upstream;
  }

  # NextAuth routes must stay on the web app, not the Rust API.
  location /api/auth/ {
    set $web_auth_upstream vagabond-web:3000;
    proxy_pass http://$web_auth_upstream;
  }

  # Rust API
  location /api/ {
    set $api_upstream vagabond-server:3001;
    proxy_pass http://$api_upstream;
  }

  # Martin vector tile server
  location /tiles/ {
    set $tiles_upstream martin:3000;
    proxy_pass http://$tiles_upstream/;
  }

  # Keycloak (served with KC_HTTP_RELATIVE_PATH=/auth)
  location /auth/ {
    # Keep the original URI when proxying. Using a variable together with
    # a URI suffix can collapse forwarded paths and trigger redirect loops.
    proxy_pass http://keycloak:8080;
  }
}
