---
# vagabond/docker-compose.yml
#
# Usage:
#   docker compose up -d
#   docker compose --profile auth up -d
#   docker compose --profile auth --profile storage --profile observability up -d
#   docker compose down --remove-orphans

name: vagabond

services:

  # ── Nginx Gateway (single origin for web/api/tiles/auth) ───────────────────
  vagabond-gateway:
    image: nginx:1.27-alpine
    container_name: vagabond-gateway
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      - vagabond-web
      - vagabond-server
      - martin

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vagabond-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-vagabond}
      POSTGRES_USER:     ${POSTGRES_USER:-vagabond}
      # Override in production; default matches .env.example / Playwright CI.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vagabond}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-dev-user-seed:
    image: postgis/postgis:16-3.4
    container_name: vagabond-postgres-dev-user-seed
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-vagabond}
      PGUSER: ${POSTGRES_USER:-vagabond}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
    command: >
      sh -ec "
      until psql -v ON_ERROR_STOP=1 -tAc \"SELECT to_regclass('public.users') IS NOT NULL\" | grep -q t; do
        echo 'waiting for users table...';
        sleep 2;
      done;
      psql -v ON_ERROR_STOP=1 -c
      \"INSERT INTO users (id, keycloak_sub, email, display_name)
      VALUES ('${VAGABOND_DEV_USER_ID:-00000000-0000-0000-0000-000000000001}',
              'dev:${VAGABOND_DEV_USER_ID:-00000000-0000-0000-0000-000000000001}',
              '${VAGABOND_DEV_USER_EMAIL:-dev-user@vagabond.local}',
              '${VAGABOND_DEV_USER_DISPLAY_NAME:-Dev User}')
      ON CONFLICT (id) DO UPDATE SET
        keycloak_sub = EXCLUDED.keycloak_sub,
        email = EXCLUDED.email,
        display_name = EXCLUDED.display_name,
        updated_at = NOW();\""
    depends_on:
      postgres:
        condition: service_healthy

  # ── Martin (MVT tile server) ──────────────────────────────────────────────
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: vagabond-martin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vagabond}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-vagabond}
    ports:
      - "${MARTIN_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Vagabond API server (Rust/Axum) ───────────────────────────────────────
  vagabond-server:
    build:
      context: .
      dockerfile: crates/vagabond-server/Dockerfile
    container_name: vagabond-server
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-vagabond}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-vagabond}
      LISTEN_ADDR:     0.0.0.0:3001
      # Override in production; default lets `compose up postgres` interpolate in CI.
      JWT_SECRET:      ${JWT_SECRET:-change-me-to-a-long-random-secret}
      # Core local default: header auth. Set false when using --profile auth + Keycloak JWTs.
      VAGABOND_DEV_AUTH: ${VAGABOND_DEV_AUTH:-true}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost/auth/realms/vagabond}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/auth/realms/vagabond/protocol/openid-connect/certs}
      RUST_LOG:        ${RUST_LOG:-info}
    ports:
      - "${SERVER_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Vagabond Web (Next.js) ────────────────────────────────────────────────
  # Keycloak client `vagabond-web`: standard flow, redirect URI
  # http://localhost/api/auth/callback/keycloak, web origins http://localhost (see infra/keycloak/README.md).
  vagabond-web:
    build:
      context: web/vagabond-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_MARTIN_URL: ${NEXT_PUBLIC_MARTIN_URL:-http://localhost/tiles}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost/auth}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-vagabond}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-vagabond-web}
        NEXT_PUBLIC_VAGABOND_DEV_AUTH: ${NEXT_PUBLIC_VAGABOND_DEV_AUTH:-true}
        NEXT_PUBLIC_PMTILES_URL: ${NEXT_PUBLIC_PMTILES_URL:-}
    container_name: vagabond-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      NEXT_PUBLIC_MARTIN_URL: ${NEXT_PUBLIC_MARTIN_URL:-http://localhost/tiles}
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost/auth}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-vagabond}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-vagabond-web}
      NEXT_PUBLIC_VAGABOND_DEV_AUTH: ${NEXT_PUBLIC_VAGABOND_DEV_AUTH:-true}
      NEXT_PUBLIC_PMTILES_URL: ${NEXT_PUBLIC_PMTILES_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - vagabond-server

  # ── Keycloak (--profile auth) ─────────────────────────────────────────────
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:24.0
    container_name: vagabond-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vagabond}
      KC_DB_USERNAME:          ${POSTGRES_USER:-vagabond}
      KC_DB_PASSWORD:          ${POSTGRES_PASSWORD:-changeme}
      KC_HOSTNAME_STRICT:      false
      KC_HOSTNAME:             localhost
      KC_PROXY_HEADERS:        xforwarded
      KC_HTTP_RELATIVE_PATH:   /auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── MinIO (--profile storage) ─────────────────────────────────────────────
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: vagabond-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-vagabond}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # ── Prometheus (--profile observability) ──────────────────────────────────
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: vagabond-prometheus
    restart: unless-stopped
    extra_hosts:
      - "vagabond-client:host-gateway"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  postgres-exporter:
    profiles: ["observability"]
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: vagabond-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-vagabond}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-vagabond}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: vagabond-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    profiles: ["observability"]
    image: prom/node-exporter:latest
    container_name: vagabond-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave

  # ── Grafana (--profile observability) ─────────────────────────────────────
  grafana:
    profiles: ["observability"]
    image: grafana/grafana-oss:latest
    container_name: vagabond-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL:         ${GRAFANA_ROOT_URL:-http://localhost:3003}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
