global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vagabond-server
    static_configs:
      - targets: ["vagabond-server:3001"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres:9187"]   # postgres_exporter sidecar if added later

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]  # node_exporter if added later
